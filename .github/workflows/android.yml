name: APK de prueba Android

on:
  push:
    branches: [main, desarrollo-figma]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 20 "$RUNNER_TEMP/pub-output.txt")
            exit 1
          }
      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/test-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'EXCEPTION CAUGHT|overflowed|Expected:|Actual:|Error:|test/flows_test.dart:[0-9]+' "$RUNNER_TEMP/test-output.txt" | head -n 20)
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 45 "$RUNNER_TEMP/test-output.txt")
            exit 1
          }
      - name: Analizar código
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E 'error •|warning •' "$RUNNER_TEMP/analyze-output.txt" | head -n 40)
            exit 1
          }
      - name: Compilar APK de prueba por arquitectura
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --no-pub 2>&1 | tee "$RUNNER_TEMP/build-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 45 "$RUNNER_TEMP/build-output.txt")
            exit 1
          }
      - name: Guardar APK ARM64
        uses: actions/upload-artifact@v7
        with:
          name: rimaykullayki-arm64-prueba
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Guardar APK ARM 32 bits
        uses: actions/upload-artifact@v7
        with:
          name: rimaykullayki-arm32-prueba
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Guardar APK para emulador
        uses: actions/upload-artifact@v7
        with:
          name: rimaykullayki-x86-64-prueba
          path: mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7
