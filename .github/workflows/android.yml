name: APK de prueba Android

on:
  push:
    branches: [main, desarrollo-figma]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 20 "$RUNNER_TEMP/pub-output.txt")
            exit 1
          }
      - name: Ejecutar pruebas
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/test-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 45 "$RUNNER_TEMP/test-output.txt")
            exit 1
          }
      - name: Analizar código
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze-output.txt" || {
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 30 "$RUNNER_TEMP/analyze-output.txt")
            exit 1
          }
      - name: Compilar APK de prueba por arquitectura
        run: flutter build apk --release --split-per-abi --no-pub
      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: control-gestantes-apk-prueba
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7
