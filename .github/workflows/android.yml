name: APK de prueba Android

on:
  push:
    branches: [main, desarrollo-figma]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Instalar dependencias
        run: flutter pub get
      - name: Ejecutar pruebas
        run: flutter test --no-pub
      - name: Analizar código
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Compilar APK de prueba por arquitectura
        run: flutter build apk --release --split-per-abi --no-pub
      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: control-gestantes-apk-prueba
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7
