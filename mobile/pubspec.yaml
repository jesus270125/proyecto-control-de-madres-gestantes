name: control_gestantes
description: Aplicación de acompañamiento prenatal.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.0
  pdf: ^3.11.0
  share_plus: ^13.3.1
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
